# 作り直している画面（`/next/`）へ、いまの画面と同じ e2e を向ける（`playwright.next.config.ts`）。
# 入れ替えるまでは落ちてよいので、required check には入れない。何本通るかを見るためのもの。
# 画面がまだ無いうちは全部がタイムアウトまで待って長くかかるので、新しい画面か、それを配信する設定を変える PR と、手動でだけ回す。
name: e2e-next

on:
  pull_request:
    paths:
      - "web/**"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "playwright.next.config.ts"
      - ".github/workflows/e2e-next.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-next:
    name: e2e-next
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: このリポジトリを取る（submodule は取らない）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: ./.github/actions/checkout-engine
        with:
          deploy-key: ${{ secrets.ENGINE_DEPLOY_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium

      - name: 新しい画面を動かして検査する
        run: npm run test:e2e:next
