# 型検査と書式とテストを回し、main では通ったものを本番へ出す（`docs/deploy.md`）。
# ブランチ保護の required check は検査の job の名前（verify）。
#
# エンジンは private な submodule なので、取得だけ deploy key（読み取り専用）で行う
# （`.github/actions/checkout-engine`）。
name: verify

on:
  push:
    branches: [main]
  pull_request:
  # 出し直すときと、対戦が終わるのを待たずに出すときに使う。
  workflow_dispatch:
    inputs:
      wait_for_idle:
        description: 指している対戦が終わるまで待ってから出す
        type: boolean
        default: true

# 公開リポジトリなので、既定の権限を読み取りだけに絞る。
permissions:
  contents: read

# PR では、同じブランチに新しい push が来たら走っている方を止める。
# main では止めずに 1 つずつ走らせる。止めると、対戦が終わるのを待っているデプロイまで途中で切れる。
# 走っている間に来た実行は並び、さらに次が来たら並んでいた方が取り消される。並ぶのは常に最後に来た
# 実行なので、古い版があとから出ることは無い。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: このリポジトリを取る（submodule は取らない）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: ./.github/actions/checkout-engine
        with:
          deploy-key: ${{ secrets.ENGINE_DEPLOY_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # 型検査、書式、全テスト。engine/ 配下は .prettierignore で書式検査の対象外。
      - name: 検査する
        run: npm run verify:all

      # ブラウザは PR ごとに取り直す。入れるのは chromium 1 つだけで、
      # `--with-deps` が Ubuntu 側の不足ライブラリも入れる。
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium

      - name: 画面を動かして検査する
        run: npm run test:e2e

      # 落ちたときだけ trace を残す。`retain-on-failure` が `test-results/` へ出すが、
      # 上げておかないとランナーごと捨てられる。**手元で再現しない競合はこれしか手掛かりが無い。**
      # `verify:all` の段で落ちるとこのディレクトリは無いので、無ければ黙って通す。
      - name: 落ちたときの trace を残す
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-trace
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: deploy
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Cloudflare のトークンは、この environment のシークレットに置く。environment の側で
    # 出せるブランチを main に絞れば、ほかのブランチの実行からはトークンを読めない。
    environment: production
    # 対戦が終わるのを待つ 60 分を含める。
    timeout-minutes: 90
    env:
      PRODUCTION_URL: https://poke-tcg-online.dev2nano.workers.dev
    steps:
      - name: Cloudflare のトークンが渡っているか確かめる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN か CLOUDFLARE_ACCOUNT_ID が空。Settings > Environments > production の Environment secrets に登録すること（docs/deploy.md）。"
            exit 1
          fi

      - name: このリポジトリを取る（submodule は取らない）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - uses: ./.github/actions/checkout-engine
        with:
          deploy-key: ${{ secrets.ENGINE_DEPLOY_KEY }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: 指している対戦が終わるのを待つ
        if: github.event_name != 'workflow_dispatch' || inputs.wait_for_idle
        run: npx tsx tools/wait-for-idle.ts "$PRODUCTION_URL" 60

      - name: 出す
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
