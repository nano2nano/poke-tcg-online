# 型検査と書式とテストを回す。ブランチ保護の required check はこの job の名前（verify）。
#
# エンジンは private な submodule なので、取得だけ deploy key（読み取り専用）で行う。
# リポジトリ自身の checkout には既定のトークンを使い、鍵を渡さない。鍵が要るのは
# submodule の 1 行だけで、範囲をそこへ閉じる。
name: verify

on:
  push:
    branches: [main]
  pull_request:

# 公開リポジトリなので、既定の権限を読み取りだけに絞る。
permissions:
  contents: read

# 同じ ref に新しい push が来たら、走っている方を止める。
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: このリポジトリを取る（submodule は取らない）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: エンジンを読む鍵が渡っているか確かめる
        env:
          ENGINE_DEPLOY_KEY: ${{ secrets.ENGINE_DEPLOY_KEY }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$ENGINE_DEPLOY_KEY" ]; then
            exit 0
          fi
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::error::dependabot が起こした実行には Actions のシークレットが渡らない。Settings > Secrets and variables > Dependabot にも同じ名前で同じ deploy key を登録すること。"
          elif [ "$IS_FORK" = "true" ]; then
            echo "::error::fork から来た PR にはシークレットが渡らないため、エンジン（private な submodule）を取得できない。この PR を検査するには、同じ変更をこのリポジトリのブランチへ push すること。"
          else
            echo "::error::ENGINE_DEPLOY_KEY が空。Settings > Secrets and variables > Actions に、poke-tcg-engine を読める deploy key（SSH 秘密鍵）を同じ名前で登録すること。"
          fi
          exit 1

      # この action には deploy key の秘密鍵を渡す。タグは書き換えられるので、
      # 差し替えが起きても効かないようにコミットの SHA で固定する。更新は dependabot に任せる。
      - name: 鍵を ssh-agent へ載せる
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.ENGINE_DEPLOY_KEY }}

      - name: github.com のホスト鍵を控える
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts

      # .gitmodules は https の URL を持つ。鍵で取れるのは ssh なので、この 1 回だけ読み替える。
      # 設定はリポジトリへ書き込まず、このコマンドの中だけで効かせる。
      - name: エンジン（submodule）を取る
        run: |
          git -c url."git@github.com:".insteadOf=https://github.com/ \
            submodule update --init --depth 1 engine
          test -f engine/package.json \
            || { echo "::error::engine/ が空のまま。submodule の取得に失敗している"; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      # 型検査、書式、全テスト。engine/ 配下は .prettierignore で書式検査の対象外。
      - name: 検査する
        run: npm run verify:all

      # ブラウザは PR ごとに取り直す。入れるのは chromium 1 つだけで、
      # `--with-deps` が Ubuntu 側の不足ライブラリも入れる。
      - name: ブラウザを入れる
        run: npx playwright install --with-deps chromium

      - name: 画面を動かして検査する
        run: npm run test:e2e

      # 落ちたときだけ trace を残す。`retain-on-failure` が `test-results/` へ出すが、
      # 上げておかないとランナーごと捨てられる。**手元で再現しない競合はこれしか手掛かりが無い。**
      # `verify:all` の段で落ちるとこのディレクトリは無いので、無ければ黙って通す。
      - name: 落ちたときの trace を残す
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-trace
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
