# action は SHA で固定してあるので、更新が来ても気づけない。ここで週ごとに確かめる。
# dependabot は `# v4` の注釈も新しい版に書き換える。
version: 2
updates:
  # `/` が見るのは `.github/workflows/` だけで、自前の composite action の中は別に指す。
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # npm の依存も週ごとに見る。ここが無いと、勧告が出ても PR が来ない。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
